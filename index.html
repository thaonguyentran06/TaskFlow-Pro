<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOOM — Personal Productivity Studio</title><link rel="stylesheet" href="style.css?v=rose-final3"></head><body><aside><a class="brand" href="#today">bloom<span>.</span></a><small>PERSONAL PRODUCTIVITY STUDIO</small><nav id="nav"></nav><div class="sidefoot">Small steps,<br><em>meaningful days.</em><button id="theme">◐ Đổi giao diện</button><button id="export">↓ Xuất dữ liệu</button></div></aside><main><header><span>THE DAILY EDITION / <span id="date"></span></span><button class="primary" id="add">+ Công việc mới</button></header><section id="page"></section><footer> BLOOM STUDIO — Make room for what matters.</footer></main><dialog id="modal"><form id="form"><div class="sectionhead"><h2 id="formtitle">Công việc mới</h2><button type="button" id="close">×</button></div><label>Tên công việc<input name="title" required maxlength="150"></label><label>Mô tả<textarea name="description"></textarea></label><div class="fields"><label>Deadline<input name="deadline" type="date"></label><label>Danh mục<select name="category"><option>Học tập</option><option>Công việc</option><option>Cá nhân</option></select></label><label>Ưu tiên<select name="priority"><option>Vừa</option><option>Cao</option><option>Thấp</option></select></label><label>Trạng thái<select name="status"><option value="todo">Chưa làm</option><option value="doing">Đang làm</option><option value="done">Hoàn thành</option></select></label></div><label class="inline"><input type="checkbox" name="important"> Quan trọng</label><label class="inline"><input type="checkbox" name="urgent"> Khẩn cấp</label><button class="primary" type="submit">Lưu công việc</button></form></dialog><div id="notice" role="status"></div><script type="module" src="app.js?v=rose-final3"></script></body></html>
